[project]
name = "beedrill"
version = "0.11.0"
description = "Continuous security-control validation for Solana protocols"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beesdk==0.2.0",
]

[tool.uv.sources]
beesdk = { path = "../beesdk", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beedrill = [
    "reference_target/Cargo.toml",
    "reference_target/Cargo.lock",
    "reference_target/reference_vault.json",
    "reference_target/reference_oracle_market.json",
    "reference_target/oracle_market/Cargo.toml",
    "reference_target/oracle_market/src/lib.rs",
    "reference_target/src/lib.rs",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
