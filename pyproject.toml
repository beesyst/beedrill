[project]
name = "beedrill"
version = "0.4.0"
description = "Continuous security-control validation for Solana protocols"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beesdk==0.1.0",
]

[tool.uv.sources]
beesdk = { path = "../beesdk" }

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
